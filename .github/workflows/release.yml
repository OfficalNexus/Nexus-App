name: Release Nexus

# Push a tag like v1.5.1 (matching package.json "version") and this builds the
# Windows installer and publishes it as a GitHub Release. Installed copies of
# Nexus pick it up automatically (electron-updater reads latest.yml from the release).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi

      - run: npm ci
      - run: node --check main.js && node --check renderer.js && node --check preload.js

      - name: Build and publish installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keeps the old pre-1.5 updater (which reads update.json from main) working
      # for anyone still on an old install. New installs ignore this file.
      - name: Refresh update.json for old installs
        continue-on-error: true
        shell: bash
        run: |
          node -e "const fs=require('fs');const v=require('./package.json').version;const f='release-v140-installer/Nexus-Setup-'+v+'.exe';fs.writeFileSync('update.json',JSON.stringify({version:v,notes:'Nexus '+v,url:'https://github.com/OfficalNexus/Nexus-App/releases/download/v'+v+'/Nexus-Setup-'+v+'.exe',size:fs.statSync(f).size},null,2)+'\\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Update manifest for v$(node -p "require('./package.json').version")" || exit 0
          git push origin HEAD:main
