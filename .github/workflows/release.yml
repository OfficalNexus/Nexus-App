name: Release Nexus

# Push a tag like v1.5.1 (matching package.json "version") and this builds the
# Windows installer and publishes it as a GitHub Release. Installed copies of
# Nexus pick it up automatically (electron-updater reads latest.yml from the release).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi

      - run: npm ci
      - run: node --check main.js && node --check renderer.js && node --check preload.js

      - name: Build installer
        run: npm run package:installer
      - name: Create updater manifest
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const v = require('./package.json').version;
          const file = `release-v140-installer/Nexus-Setup-${v}.exe`;
          const data = fs.readFileSync(file);
          const sha512 = crypto.createHash('sha512').update(data).digest('base64');
          fs.writeFileSync('release-v140-installer/latest.yml', [
            `version: ${v}`,
            'files:',
            `  - url: Nexus-Setup-${v}.exe`,
            `    sha512: ${sha512}`,
            `    size: ${data.length}`,
            `path: Nexus-Setup-${v}.exe`,
            `sha512: ${sha512}`,
            `releaseDate: ${new Date().toISOString()}`,
            ''
          ].join('\n'));
          NODE
      - name: Create or update GitHub release assets
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          gh release create "v$v" --repo "$GITHUB_REPOSITORY" --title "Nexus $v" --notes "Nexus $v FPS Game Profile Manager" || true
          gh release upload "v$v" --repo "$GITHUB_REPOSITORY" \
            "release-v140-installer/Nexus-Setup-$v.exe" \
            "release-v140-installer/Nexus-Setup-$v.exe.blockmap" \
            "release-v140-installer/latest.yml" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keeps the old pre-1.5 updater (which reads update.json from main) working
      # for anyone still on an old install. New installs ignore this file.
      - name: Refresh update.json for old installs
        continue-on-error: true
        shell: bash
        run: |
          node -e "const fs=require('fs');const v=require('./package.json').version;const f='release-v140-installer/Nexus-Setup-'+v+'.exe';fs.writeFileSync('update.json',JSON.stringify({version:v,notes:'Nexus '+v,url:'https://github.com/OfficalNexus/Nexus-App/releases/download/v'+v+'/Nexus-Setup-'+v+'.exe',size:fs.statSync(f).size},null,2)+'\\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Update manifest for v$(node -p "require('./package.json').version")" || exit 0
          git push origin HEAD:main
